<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>계정 삭제 안내 — 메모(MAJORMO)</title>
<meta name="description" content="메모(MAJORMO) 계정 및 데이터 삭제 요청 방법" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>
<div class="wrap">

  <a class="back" href="../index.html">← 개발자 페이지로</a>

  <header>
    <div class="app">메모 (MAJORMO)</div>
    <h1>계정 삭제 안내</h1>
    <div class="meta">
      <span><b>최종 개정일</b> 0000년 00월 00일</span>
      <span><b>앱</b> com.majormo.myapp</span>
    </div>
  </header>

  <main>
    <!-- ═══════════════════════════════════════════════════════════════
         여기부터 본문을 붙여넣으세요.

         ⚠️ 이 문서는 Play Console "데이터 보안 → 계정 삭제 URL"에
            등록되는 심사 요건 문서다. 구글이 요구하는 항목이 정해져 있다.

         구글이 요구하는 것 (빠지면 심사에서 걸림)
           · 앱 이름 명시
           · 계정 삭제를 "요청하는 방법"을 단계별로 (앱 내 경로 + 이메일 경로 둘 다)
           · 삭제되는 데이터와 보관되는 데이터를 구분해서 명시
           · 보관하는 데이터의 보유기간과 근거
             (메모는 완료된 환전 기록을 정산 근거로 보관 — 근거를 적을 것)
           · 삭제 처리 소요 기간

         앱 내 경로: 설정 탭 → 계정 삭제
           (실제 화면 문구와 일치하는지 확인하고 쓸 것 —
            앱은 delete_account RPC로 즉시 처리된다)
         ═══════════════════════════════════════════════════════════ -->

    <h2>앱에서 바로 삭제하기</h2>
    <p>본문 준비 중입니다.</p>

    <h2>이메일로 요청하기</h2>
    <p>본문 준비 중입니다.</p>

    <h2>삭제되는 데이터 / 보관되는 데이터</h2>
    <p>본문 준비 중입니다.</p>

  </main>

  <section class="history">
    <h2>개정 이력</h2>
    <ul>
      <li><b>0000-00-00</b> 제정</li>
    </ul>
  </section>

  <footer>
    삭제 요청 <a href="mailto:mememo.reviewer@gmail.com">mememo.reviewer@gmail.com</a><br />
    개발자 김상현
  </footer>

</div>
</body>
</html>
